name: "Contributor Licence Agreement"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: "Check or record the CLA"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the Contributor Licence Agreement and I agree to its terms') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/paultendo/tothepenny/blob/main/CLA.md'
          # Signatures live on their own branch so that main can be protected.
          branch: 'cla-signatures'
          allowlist: paultendo,dependabot[bot]
          custom-pr-sign-comment: 'I have read the Contributor Licence Agreement and I agree to its terms'
          custom-notsigned-prcomment: 'Thank you for your contribution. Before it can be merged, please read the [Contributor Licence Agreement](https://github.com/paultendo/tothepenny/blob/main/CLA.md) and, if you agree, reply to this pull request with the exact sentence below.'
          custom-allsigned-prcomment: 'Thank you: every contributor to this pull request has agreed to the Contributor Licence Agreement.'
