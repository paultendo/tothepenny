<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tothepenny</title>
  <meta name="description" content="Drop in PDF bank statements. tothepenny reads every line, checks it against the bank's own balances, and hands you a spreadsheet. It all happens in your browser.">
  <style>
    :root { --background: #ffffff; --foreground: #0a1628; --ink-muted: #3e5266; --accent: #16a34a;
      --accent-soft: rgba(22, 163, 74, .12); --line: rgba(14, 30, 50, .12); --red: #c53030; --red-soft: rgba(197, 48, 48, .1);
      --amber: #b7791f; --amber-soft: rgba(183, 121, 31, .12); }
    @media (prefers-color-scheme: dark) {
      :root { --background: #090e17; --foreground: #eef4ff; --ink-muted: #bcc9df; --accent: #1ed760;
        --accent-soft: rgba(30, 215, 96, .18); --line: rgba(208, 227, 255, .15); --red: #ff5a5a; --red-soft: rgba(255, 90, 90, .12); }
    }
    body { margin: 0; background: var(--background); color: var(--foreground); font-family: system-ui, sans-serif; line-height: 1.5; }
    main { max-width: 60rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
    .mark { font: 500 .8rem ui-monospace, 'SF Mono', Menlo, monospace; color: var(--ink-muted); margin: 0 0 .8rem; }
    h1 { font: 400 clamp(2rem, 3.4vw, 2.6rem)/1.05 Georgia, 'Times New Roman', serif; margin: 0 0 .8rem; letter-spacing: -.02em; }
    .lede { color: var(--ink-muted); font-size: 1.1rem; margin: 0 0 1.8rem; max-width: 44rem; }
    footer { color: var(--ink-muted); font-size: .88rem; margin-top: 3rem; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <p class="mark">tothepenny</p>
    <h1>Does it add up?</h1>
    <p class="lede">Drop in PDF bank statements. tothepenny reads every line, checks it against the bank's own balances,
      and hands you a spreadsheet. It all happens in this tab.</p>
    <div id="tothepenny"></div>
    <footer>
      <a href="https://github.com/paultendo/tothepenny">Source</a> ·
      <a href="https://buymeacoffee.com/paultendo">Buy me a coffee</a> ·
      AGPL-3.0 or commercial licence · tothepenny by Paul Wood FRSA
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
