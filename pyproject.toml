[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tothepenny"
version = "0.1.0"
description = "Extract transactions from bank statement PDFs (UK banks, plus some French and Brazilian banks), locally, and check each statement against the balances the bank printed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only OR LicenseRef-Commercial" }
authors = [{ name = "Paul Wood FRSA" }]
keywords = ["bank statements", "pdf", "reconciliation", "legal", "forensic accounting", "uk banks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "pypdfium2>=4.0",
    "pytesseract>=0.3.10",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "openpyxl>=3.1.0",
    "python-dateutil>=2.8.2",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "reportlab>=4.0"]

[project.scripts]
tothepenny = "tothepenny.cli:main"

[project.urls]
Homepage = "https://github.com/paultendo/tothepenny"
Issues = "https://github.com/paultendo/tothepenny/issues"

[tool.setuptools.packages.find]
include = ["tothepenny*"]

[tool.setuptools.package-data]
tothepenny = ["bank_templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
