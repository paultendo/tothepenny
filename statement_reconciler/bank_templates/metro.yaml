# Metro Bank Configuration
# https://metrobankonline.co.uk

metro:
  # Bank identification patterns
  identifiers:
    - "Metro Bank"
    - "metrobankonline.co.uk"
    - "MYMBGB2L"  # BIC code
    - "Personal Current Account Statement"
    - "Cash Account Statement"

  # Header patterns for metadata extraction
  header_patterns:
    account_number: 'Account No:\s*(\d+)'
    sort_code: 'Sort Code:\s*([\d-]+)'
    # The older layout labels these "Current Statement Period:" / "Opening Balance:"; the newer "Cash Account
    # Statement" puts them in an "Account Summary" box without colons.
    period_start: '(?:Current Statement Period:|Account Summary)\s*(\d{2}\s+[A-Z]{3}\s+\d{4})\s*-'
    period_end: '(?:Current Statement Period:|Account Summary)\s*\d{2}\s+[A-Z]{3}\s+\d{4}\s*-\s*(\d{2}\s+[A-Z]{3}\s+\d{4})'
    previous_balance: 'Opening Balance:?\s*[£]?(-?[\d,]+\.\d{2})'
    new_balance: 'Closing Balance:?\s*[£]?(-?[\d,]+\.\d{2})'

  # Date formats (Metro uses "DD MMM YYYY" format)
  date_formats:
    - "%d %b %Y"   # 01 OCT 2024
    - "%d %B %Y"   # 01 October 2024

  # Transaction patterns
  # Format: DD MMM YYYY    Description    MONEY OUT    MONEY IN    BALANCE
  transaction_patterns:
    # Main transaction line with date
    main: '(\d{2}\s+[A-Z]{3}\s+\d{4})\s+(.+?)\s{2,}([\d,]+\.\d{2})?\s*([\d,]+\.\d{2})?\s+([\d,]+\.\d{2})$'
    # Continuation line (description only, indented)
    continuation: '^\s{20,}(\S.*)$'

  # Lines to skip
  skip_patterns:
    - 'Balance brought forward'
    - 'Balance carried forward'
    - 'Closing Balance'
    - 'DATE\s+TRANSACTION'
    - 'Personal Current Account Statement'
    - 'Your deposit is classed'
    - 'Financial Services Compensation'
    - 'ACCOUNT SUMMARY'
    - 'OVERDRAFT INTEREST'
    - 'Arranged Overdraft'
    - 'Unarranged Overdraft'
    - 'Total Interest'
    - 'MBS8C_'
    - 'Does not include charges'
    - 'The rate of interest'
    - 'Interest and charges will'
    - 'monthly cap on unarranged'
    - 'Banking Weekday'
    - 'One Southampton Row'
    - 'London WC1B'
    - 'metrobankonline.co.uk'
    - 'BIC:'
    - 'IBAN:'
    - 'Statement No:'
    - 'Current Statement Period:'
    - 'Opening Balance:'
    - 'Total Money In:'
    - 'Total Money Out:'
    - 'ACCOUNT NAME:'
    - 'Your transactions'
    - '^\s*$'

  # Column positions (approximate)
  column_patterns:
    date: '^\d{2}\s+[A-Z]{3}\s+\d{4}'
    description: '.{20,}'
    money_out: '[\d,]+\.\d{2}'
    money_in: '[\d,]+\.\d{2}'
    balance: '[\d,]+\.\d{2}\s*$'
